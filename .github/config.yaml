defaults:
  workItemType: User Story
  storyPoints: 0
  priority: 2
  ready: Yes
  workType: "4. Software / UX"
  placeNewStoriesAtTopOfBacklog: true

notifications:
  teams:
    enabled: true
    # Created via Teams channel > ... > Workflows > "Send webhook alerts to a channel".
    # The URL is a secret (its `sig` query param is the only auth) - store it in this
    # env var, never in this file or any committed artifact.
    webhookUrlEnvVar: TEAMS_WEBHOOK_URL
    payloadFormat: adaptiveCard
    adaptiveCardVersion: "1.4"
    # Envelope the Workflows trigger expects:
    #   { "type": "message",
    #     "attachments": [ { "contentType": "application/vnd.microsoft.card.adaptive",
    #                        "content": { <AdaptiveCard> } } ] }
    # POST with Content-Type: application/json. A successful post returns HTTP 202
    # with an empty body, so do not treat an empty response as a failure.
    setupNotes: >-
      Legacy Office 365 "Incoming Webhook" connectors are retired; use the Workflows
      template above. Requires a Standard (not private/shared) channel. To rotate the
      secret, delete and recreate the flow, then update the TEAMS_WEBHOOK_URL env var.

commands:
  createStory: true
  moveStory: true
  updateStory: true
  postToTeams: true